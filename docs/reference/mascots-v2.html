<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flint — mascotes v2 (estilo da logo)</title>
<style>
  :root { --bg: #0E0A12; --surface: #17111D; --text: #F5F0F7; --muted: #A193AA; --crimson: #E5163E; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Archivo Variable", system-ui, sans-serif; padding: 48px 24px; -webkit-font-smoothing: antialiased; }
  h1 { font-size: 40px; font-weight: 900; font-stretch: 125%; letter-spacing: -.03em; margin: 0 0 8px; }
  h2 { font-size: 15px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 36px 0 12px; }
  p { color: var(--muted); margin: 0 0 8px; max-width: 60ch; line-height: 1.5; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  figure { margin: 0; background: var(--surface); border-radius: 22px; padding: 24px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 170px; }
  figcaption { font-size: 14px; font-weight: 700; }
  .logo img { width: 140px; height: 140px; border-radius: 30px; }
  .acts { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
  .acts button { font: inherit; font-size: 14px; font-weight: 650; color: var(--text); background: var(--surface); border: 1px solid rgba(255,235,245,.1); border-radius: 999px; padding: 10px 16px; cursor: pointer; }
</style>
</head>
<body>
<h1>Mascotes no estilo da logo</h1>
<p>Silhueta chapada, olhos brancos recortados e sombra de duas cores. Em repouso o rosto é o da logo; a boca só aparece quando o mascote sente algo.</p>
<h2>Novo</h2>
<div class="row" id="v2">
  <figure class="logo"><img src="/brand/logo-original.jpg" alt=""><figcaption>Logo</figcaption></figure>
</div>
<div class="acts">
  <button data-a="comemorar">Comemorar</button><button data-a="danca">Dançar</button><button data-a="boxe">Boxe</button>
  <button data-a="bravo">Bravo</button><button data-a="acenar">Acenar</button><button data-a="dormir">Dormir</button><button data-mood>Triste / feliz</button>
</div>
<h2>Antes (backup)</h2>
<div class="row" id="v1"></div>
<script type="module">
  import '@fontsource-variable/archivo/standard.css';
  import { mountMascot } from '/src/mascots/engine.js';
  import { mountMascot as mountOld } from '/docs/reference/mascots-v1/engine.js';
  const LIST = [['faisca', 'faisca', 'Faísca'], ['faisca', 'chama', 'Chama'], ['faisca', 'fogueira', 'Fogueira'], ['faisca', 'forja', 'Forja'], ['gota', null, 'Gota'], ['pedra', null, 'Pedra A (facetada)'], ['seixo', null, 'Pedra B (seixo)']];
  const put = (row, mount) => LIST.map(([kind, stage, name]) => {
    const fig = document.createElement('figure'), el = document.createElement('div');
    el.style.cssText = 'width:150px;height:200px';
    fig.append(el); fig.insertAdjacentHTML('beforeend', `<figcaption>${name}</figcaption>`); document.getElementById(row).append(fig);
    return mount(el, kind, { stage: stage ?? undefined });
  });
  const hs = put('v2', mountMascot); put('v1', (el, k, o) => k === 'seixo' ? { act() {}, setMood() {} } : mountOld(el, k, o));
  let sad = false;
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => hs.forEach(h => h.act(b.dataset.a)));
  document.querySelector('[data-mood]').onclick = () => { sad = !sad; hs.forEach(h => h.setMood(sad ? 'sad' : 'happy')); };
</script>
</body>
</html>
